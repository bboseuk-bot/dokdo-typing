<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 실시간 독도 수호 타자 대전</title>
  <!-- Firebase SDK 불러오기 -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Pretendard', sans-serif; background: #f0f9ff; margin: 0; padding: 20px; text-align: center; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    .rank-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .rank-table th, .rank-table td { border: 1px solid #cbd5e1; padding: 10px; }
    .rank-table th { background: #0284c7; color: white; }
    .btn { background: #0284c7; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h1>🏝️ 온라인 실시간 독도 수호 대전</h1>
  <p>인터넷으로 접속한 전교생의 데이터가 실시간으로 집계됩니다.</p>

  <!-- 학생 접속 및 등록 -->
  <div id="login-section">
    <input type="text" id="studentId" placeholder="학번 (예: 10305)" style="padding: 8px;">
    <input type="text" id="studentName" placeholder="이름 (예: 홍길동)" style="padding: 8px;">
    <button class="btn" onclick="registerAndStart()">참여하기</button>
  </div>

  <!-- 실시간 학급 랭킹 표 -->
  <div style="margin-top: 30px;">
    <h2>📊 실시간 학급 대전 랭킹 (Real-time DB)</h2>
    <table class="rank-table">
      <thead>
        <tr>
          <th>순위</th>
          <th>학급</th>
          <th>참여 인원</th>
          <th>학급 평균 점수</th>
        </tr>
      </thead>
      <tbody id="live-class-rank">
        <tr><td colspan="4">실시간 데이터 불러오는 중...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // 1. 구글 파이어베이스(Firebase) 설정 정보 입력 (https://console.firebase.google.com 생성)
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  // Firebase 초기화
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // 학생 등록 및 저장 함수
  function registerAndStart() {
    const id = document.getElementById('studentId').value.trim();
    const name = document.getElementById('studentName').value.trim();

    if (!id || !name) {
      alert('학번과 이름을 입력해주세요.');
      return;
    }

    // 예시 점수 산출 및 Firebase DB 저장
    const score = Math.floor(Math.random() * 300) + 700; // 대전 결과 점수
    const grade = id.substring(0, 1);
    const classNum = parseInt(id.substring(1, 3), 10);
    const className = `${grade}학년 ${classNum}반`;

    db.collection("scores").add({
      studentId: id,
      name: name,
      className: className,
      score: score,
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      alert(`[${className} ${name}] 기록 저장 완료! (점수: ${score}pt)`);
    });
  }

  // 2. 실시간 데이터베이스 수신하여 학급별 랭킹 동적 업데이트
  db.collection("scores").onSnapshot((snapshot) => {
    const classMap = {};

    snapshot.forEach((doc) => {
      const data = doc.data();
      if (!classMap[data.className]) {
        classMap[data.className] = { participants: 0, totalScore: 0 };
      }
      classMap[data.className].participants += 1;
      classMap[data.className].totalScore += data.score;
    });

    const results = Object.keys(classMap).map(cls => ({
      className: cls,
      participants: classMap[cls].participants,
      avgScore: Math.round(classMap[cls].totalScore / classMap[cls].participants)
    }));

    results.sort((a, b) => b.avgScore - a.avgScore);

    const tbody = document.getElementById('live-class-rank');
    tbody.innerHTML = '';
    results.forEach((res, index) => {
      tbody.innerHTML += `
        <tr>
          <td><b>${index + 1}위</b></td>
          <td><b>${res.className}</b></td>
          <td>${res.participants}명</td>
          <td><b>${res.avgScore} pt</b></td>
        </tr>
      `;
    });
  });
</script>

</body>
</html>
